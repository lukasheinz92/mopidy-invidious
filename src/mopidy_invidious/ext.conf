[invidious]
enabled = true
# Invidious URL as seen from the Mopidy host/container (API + audio streams)
base_url = http://invidious-app:3000
# Invidious URL as seen from Mopidy clients (used for cover art);
# defaults to base_url when empty
public_url =
# HTTP timeout in seconds
timeout = 15
# Max songs (videos) returned by a search
search_track_results = 20
# Deprecated alias of search_track_results; overrides it when set
search_results =
# Max playlists (as albums) and channels (as artists) shown above the tracks;
# only official/album playlists and channels named like the query qualify.
# 0 disables them.
search_playlist_results = 5
search_channel_results = 3
# Preferred audio formats, first available wins:
# 251 = Opus ~160k, 140 = AAC 128k, 250 = Opus ~70k, 249 = Opus ~50k
audio_itags = 251, 140, 250, 249
# Split "Artist - Title" video titles into artist and track name
parse_titles = true
# Playlist IDs (PL...) and channel IDs (UC...) shown when browsing
playlists =
channels =
# Seconds to cache video/playlist/channel metadata
cache_ttl = 3600
